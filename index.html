<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
      .badge-linkapps {
        background-color: #6f42c1;
        color: white;
      }

      /* ===========================
            DATATABLE TOOLBAR
        =========================== */

      .dataTables_wrapper .dataTables-top {
        width: 100%;
        display: flex !important;
        align-items: center !important;
        justify-content: space-between !important;
        margin: 0 0 10px 0 !important;
        padding: 0 !important;
        min-height: 32px;
      }

      /* ===========================
          LEFT : SHOW + CATEGORY
        =========================== */

      .dataTables_wrapper .dataTables-left {
        display: flex !important;
        align-items: center !important;
        gap: 8px !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      .dataTables_wrapper .dataTables-length {
        margin: 0 !important;
      }

      /* DataTables "Show 10 entries" */
      .dataTables_wrapper .dataTables_length {
        margin: 0 !important;
        padding: 0 !important;
        float: none !important;
      }

      .dataTables_wrapper .dataTables_length label {
        display: flex !important;
        align-items: center !important;
        gap: 5px !important;

        margin: 0 !important;
        padding: 0 !important;
        height: 32px;
      }

      /* Select Show 10 */
      .dataTables_wrapper .dataTables_length select {
        height: 32px !important;
        margin: 0 !important;
        padding: 2px 8px !important;
        width: 55px !important;
      }

      /* ===========================
          CATEGORY
        =========================== */

      .dataTables_wrapper .category-wrapper {
        display: flex !important;
        align-items: center !important;
        margin: 0 !important;
        padding: 0 !important;
        height: 32px;
      }

      .dataTables_wrapper #categoryFilter {
        width: 130px !important;
        height: 32px !important;

        margin: 0 !important;
        padding: 2px 8px !important;

        display: block !important;
      }

      /* ===========================
            RIGHT : SEARCH
        =========================== */

      .dataTables_wrapper .dataTables-right {
        display: flex !important;
        align-items: center !important;
        justify-content: flex-end !important;

        margin: 0 !important;
        padding: 0 !important;
      }

      .dataTables_wrapper .dataTables_filter {
        margin: 0 !important;
        padding: 0 !important;

        float: none !important;
      }

      .dataTables_wrapper .dataTables_filter label {
        display: flex !important;
        align-items: center !important;

        margin: 0 !important;
        padding: 0 !important;

        height: 32px;
      }

      .dataTables_wrapper .dataTables_filter input {
        height: 32px !important;

        margin: 0 0 0 5px !important;
        padding: 4px 8px !important;

        box-sizing: border-box;
      }
    </style>

    <title>Download Center</title>

    <link rel="icon" type="image/png" href="img/favicon.svg" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,600"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/plugins/fontawesome-free/css/all.min.css"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css"
    />

    <link
      rel="stylesheet"
      href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap4.min.css"
    />

    <style>
      body {
        background: #f4f6f9;
      }

      .card {
        border-radius: 12px;
        box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
      }

      .download-btn {
        border-radius: 20px;
        padding: 5px 18px;
      }
    </style>
  </head>

  <body class="hold-transition layout-top-nav">
    <div class="wrapper">
      <nav class="main-header navbar navbar-dark navbar-primary">
        <div class="container">
          <a href="#" class="navbar-brand d-flex align-items-center">
            <img
              src="img/logo.png"
              alt="Logo"
              style="height: 35px; width: auto; margin-right: 10px"
            />
            <span>Software Download Center</span>
          </a>
        </div>
      </nav>

      <div class="content-wrapper">
        <div class="content">
          <div class="container mt-4">
            <div class="card">
              <div class="card-header bg-primary">Software List</div>

              <div class="card-body">
                <table
                  id="table"
                  class="table table-hover table-striped table-bordered"
                >
                  <thead>
                    <tr>
                      <th>No</th>
                      <th>Category</th>
                      <th>Name</th>
                      <th>Description</th>
                      <th>Download</th>
                    </tr>
                  </thead>

                  <tbody id="softwareTable"></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>

      <footer class="main-footer text-center">Software Center 2026</footer>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>

    <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

    <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap4.min.js"></script>

    <script>
      //Ambil data dari file json
      fetch("data.json")
        .then((response) => response.json())
        .then((softwareList) => {
          /* ===========================
      LOOPING & SORTING DATA
      =========================== */

          softwareList.sort(function (a, b) {
            // Urutkan berdasarkan Category
            var categoryCompare = a.category.localeCompare(
              b.category,
              undefined,
              {
                sensitivity: "base",
              },
            );

            //jika category sama, urutkan berdasarkan name
            if (categoryCompare !== 0) {
              return categoryCompare;
            }

            return a.name.localeCompare(b.name, undefined, {
              sensitivity: "base",
            });
          });

          var html = "";

          softwareList.forEach(function (item, index) {
            html += `

      <tr>

      <td>${index + 1}</td>

      <td>
      <span class="badge badge-${item.badge}">
      ${item.category}
      </span>
      </td>

      <td>${item.name}</td>

      <td>${item.description}</td>

      <td>

      <a href="${item.link}" target="_blank"
      class="btn btn-success btn-sm download-btn">

      <i class="fas fa-download"></i>

      Download

      </a>

      </td>

      </tr>

      `;
          });

          document.getElementById("softwareTable").innerHTML = html;

          /* ===========================
      DATATABLE
      =========================== */

          $(function () {
            //data tabel
            var table = $("#table").DataTable({
              dom:
                '<"dataTables-top"' +
                '<"dataTables-left"l<"category-wrapper">>' +
                '<"dataTables-right"f>' +
                ">" +
                "rtip",
            });

            //category filter
            var categories = [];

            softwareList.forEach(function (item) {
              if (!categories.includes(item.category)) {
                categories.push(item.category);
              }
            });

            //urutkan category
            categories.sort();

            //dropdwon filter
            var categorySelect = $(
              '<select id="categoryFilter" class="form-control form-control-sm">' +
                '<option value="">All Categories</option>' +
                "</select>",
            );

            //masukkan select filter ke datatable
            $(".category-wrapper").append(categorySelect);

            //masukkan category ke select filter
            categories.forEach(function (category) {
              $("#categoryFilter").append(
                $("<option>", {
                  value: category,
                  text: category,
                }),
              );
            });

            //Filter Category
            $("#categoryFilter").on("change", function () {
              var category = $(this).val();

              table.column(1).search(category).draw();
            });
          });
        }) // Ini adalah penutup dari .then(softwareList => {
        .catch((error) => {
          // Ini untuk menampilkan pesan error di console jika data.json gagal dimuat
          console.error("Gagal memuat data JSON:", error);

          // Opsional: Tampilkan pesan ke user jika gagal
          document.getElementById("softwareTable").innerHTML = `
        <tr>
          <td colspan="5" class="text-center text-danger">
            Gagal memuat data. Pastikan Anda menjalankan file ini menggunakan Local Web Server (seperti XAMPP/Live Server).
          </td>
        </tr>
      `;
        });
    </script>
  </body>
</html>
